services:
  web:
    build: .
    ports:
      - "5001:5000"
    volumes:
      - .:/app
      - ./kids_recordings:/app/kids_recordings
      - /var/run/docker.sock:/var/run/docker.sock  # 👈 🚀 給予 Flask 呼叫 docker run 的通行證！
      - shared-data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 💡 修正：caddy 之前被寫進 web 底下變成子項目了，要跟 web 同一層縮排，
  #    才是一個獨立的 service，不然 docker compose 會解析錯誤或直接忽略這個設定。
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "443:443"   # 其他裝置連線用這個 port，走 HTTPS
      - "80:80"      # 保留 80，Caddy 預設會自動把 http 導向 https
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/certs                    # 💡 新增：mkcert 產生的固定憑證
      - caddy_data:/data       # 存放 Caddy 內部資料，容器重啟不用重新產生
      - caddy_config:/config
    depends_on:
      - web

  # 2. 全新的 Python 自動化分析後端
  backend-wer:
    build: ./backend-wer
    ports:
      - "8001:8000"
    volumes:
      - ./models:/root/.cache/whisper
      - ./torch_cache:/root/.cache/torch

  backend-npvi:
    image: speech-api:v2  # 🚀【核心更換】：換成組員給的新網站映像檔名字
    container_name: backend-npvi-1
    restart: always
    ports:
      - "8000:8000"  # 💡【Port 錯開】：把同學網站內部的 8000 對應到外部的 8001，防範跟 WER 衝突
    environment:
      - TZ=Asia/Taipei
    # 💡 既然它已經是常駐網站了，原本為了強行喚醒而掛載的 /var/run/docker.sock 與 shared-data 都可以拔掉了，保持乾淨！
    volumes:
      - ${RECORDINGS_PATH:-./kids_recordings}:/app/data:rw

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: yourpassword
      MYSQL_DATABASE: project115
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"   # 💡 phpMyAdmin 只有你自己會用，維持直接用這個 port 連線，不透過 Caddy
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: yourpassword

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # 💡 只有這一段是新加的：告訴 Docker 這個服務要用 GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1              # 用 1 張顯卡；如果你有多張、想全部給它用，改成 all
              capabilities: [gpu]

volumes:
  mysql_data:
  shared-data:
  ollama_data:
  caddy_data:
  caddy_config: