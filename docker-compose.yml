services:
  web:
    build: .
    ports:
      - "5001:5000"
    volumes:
      - .:/app
      - ./kids_recordings:/app/kids_recordings
      - /var/run/docker.sock:/var/run/docker.sock  # 👈 🚀 給予 Flask 呼叫 docker run 的通行證！
      - shared-data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 💡 改用 Cloudflare Tunnel，取代原本的 Caddy + 自簽憑證。
  #    好處：拿到的網址是 Cloudflare 自己簽發的正式憑證，所有瀏覽器/手機天生信任，
  #    完全不需要學生的裝置額外安裝任何憑證，也不需要 VPN、不需要固定 IP。
  #    這是「快速通道(quick tunnel)」模式，不用註冊 Cloudflare 帳號，
  #    每次重啟容器網址會換一次（測試用完全足夠；之後如果想要固定網址，
  #    可以升級成註冊帳號的「具名通道」，我可以再幫你設定）。
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --url http://web:5000
    depends_on:
      - web

  # 2. 全新的 Python 自動化分析後端
  backend-wer:
    build: ./backend-wer
    ports:
      - "8001:8000"
    volumes:
      - ./models:/root/.cache/whisper
      - ./torch_cache:/root/.cache/torch

  backend-npvi:
    image: speech-api:v2  # 🚀【核心更換】：換成組員給的新網站映像檔名字
    container_name: backend-npvi-1
    restart: always
    ports:
      - "8000:8000"  # 💡【Port 錯開】：把同學網站內部的 8000 對應到外部的 8001，防範跟 WER 衝突
    environment:
      - TZ=Asia/Taipei
    # 💡 既然它已經是常駐網站了，原本為了強行喚醒而掛載的 /var/run/docker.sock 與 shared-data 都可以拔掉了，保持乾淨！
    volumes:
      - ${RECORDINGS_PATH:-./kids_recordings}:/app/data:rw

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: yourpassword
      MYSQL_DATABASE: project115
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"   # 💡 phpMyAdmin 只有你自己會用，維持直接用這個 port 連線，不透過 Caddy
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: yourpassword

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # 💡 只有這一段是新加的：告訴 Docker 這個服務要用 GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1              # 用 1 張顯卡；如果你有多張、想全部給它用，改成 all
              capabilities: [gpu]

volumes:
  mysql_data:
  shared-data:
  ollama_data: