<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/navbar.css">
    <link rel="stylesheet" href="/static/css/sign_in.css">

    <script src="/static/js/sign_in.js" defer></script>
    <script src="../static/js/navbar.js" defer></script>
    <title>page.sign_in</title>

    <!-- PWA 必要標籤 -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    
    <!-- iOS 專用（建議加，讓 iOS 加入主畫面體驗更好） -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="你的App名稱">

    <style>
        /* 💡 忘記密碼連結樣式 */
        .forgot-pwd-link {
            display: block;
            text-align: right;
            font-size: 0.85rem;
            color: #e63946;
            text-decoration: none;
            margin-top: -10px;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .forgot-pwd-link:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        /* 💡 彈窗 (Modal) 核心樣式 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none; /* 預設隱藏 */
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(5px); /* 背景模糊 */
        }
        .modal-card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: modalFadeIn 0.3s ease;
        }
        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            background: none; border: none;
            font-size: 1.5rem; cursor: pointer; color: #999;
        }
        .modal-title {
            color: #e63946;
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }
        @keyframes modalFadeIn {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="bg-circle bc1"></div>
<div class="bg-circle bc2"></div>

<div id="navbar-container"></div>

<main>
    <div class="group">
        <div class="card">
            <div class="tab-wrapper">
                <div class="arrow-slot" id="arrowSlot">
                    <img class="arrow-img" id="arrowIndicator" src="/static/image/arrow.png" alt="arrow">
                </div>

                <div class="tabs">
                    <button class="tab-btn active" id="tabRegister" onclick="switchTab('register')">註冊</button>
                    <button class="tab-btn" id="tabLogin" onclick="switchTab('login')">登入</button>
                </div>
            </div>

            <div id="formRegister">
                <form action="/register" method="POST">
                    <div class="form-group" style="animation-delay:0.05s">
                        <label>姓名</label>
                        <input type="text" name="name" placeholder="請輸入您的姓名" required>
                    </div>

                    <div class="form-group" style="animation-delay:0.08s">
                        <label>年齡</label>
                        <input type="text" name="age" placeholder="請輸入您的年齡" min="1" max="120" required>
                    </div>

                    <div class="form-group" style="animation-delay:0.1s">
                        <label>帳號</label>
                        <input type="text" name="username" placeholder="請設定帳號" required>
                    </div>

                    <div class="form-group" style="animation-delay:0.15s">
                        <label>密碼</label>
                        <input type="password" name="password" placeholder="請設定密碼（至少 8 位）" required>
                    </div>

                    <button type="submit" class="submit-btn">確認註冊</button>
                </form>
                <p class="footer-hint">已有帳號？<a href="#" onclick="switchTab('login');return false;">立即登入</a></p>
            </div>

            <div id="formLogin" style="display:none;">
                <form action="/login" method="POST">
                    <div class="form-group" style="animation-delay:0.05s">
                        <label>帳號</label>
                        <input type="text" name="username" placeholder="請輸入帳號" required>
                    </div>
                    <div class="form-group" style="animation-delay:0.1s">
                        <label>密碼</label>
                        <input type="password" name="password" placeholder="請輸入密碼" required>
                    </div>

                    <a href="#" class="forgot-pwd-link" onclick="openForgotModal();return false;">忘記密碼？</a>

                    <button type="submit" class="submit-btn">確認登入</button>
                </form>
                <p class="footer-hint">尚無帳號？<a href="#" onclick="switchTab('register');return false;">立即註冊</a></p>
            </div>
        </div>

        <div class="fox-gif">
            <img src="/static/gif/fox.webp" alt="動畫" style="width: 100%; height: auto;">
        </div>
    </div>
</main>

<div id="forgotModal" class="modal-overlay">
    <div class="modal-card">
        <button class="modal-close" onclick="closeForgotModal()">✕</button>
        <h2 class="modal-title">重設密碼</h2>
        <form action="/reset_password" method="POST" id="resetForm">
            <div class="form-group">
                <label>帳號</label>
                <input type="text" name="username" placeholder="請輸入您的帳號" required>
            </div>
            <div class="form-group">
                <label>新密碼</label>
                <input type="password" name="new_password" id="new_password" placeholder="請輸入新密碼" required>
            </div>
            <div class="form-group">
                <label>確認新密碼</label>
                <input type="password" name="confirm_password" id="confirm_password" placeholder="請再次輸入新密碼" required>
            </div>
            <button type="submit" class="submit-btn">確認修改</button>
        </form>
    </div>
</div>

<script>
    // 💡 控制彈窗開關
    function openForgotModal() {
        document.getElementById('forgotModal').style.display = 'flex';
    }
    function closeForgotModal() {
        document.getElementById('forgotModal').style.display = 'none';
    }
    // 點擊背景關閉
    window.onclick = function(event) {
        const modal = document.getElementById('forgotModal');
        if (event.target == modal) closeForgotModal();
    }

    // 💡 兩次密碼一致性檢查
    document.getElementById('resetForm').onsubmit = function() {
        const p1 = document.getElementById('new_password').value;
        const p2 = document.getElementById('confirm_password').value;
        if (p1 !== p2) {
            alert("兩次輸入的新密碼不一致！");
            return false;
        }
        return true;
    };
</script>

</body>
</html>
